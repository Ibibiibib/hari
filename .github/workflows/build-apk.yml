name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Caused by|Could not|not found|Unresolved|FAILURE" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: HabitQuest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
